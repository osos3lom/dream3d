<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under the notch and home
         indicator; the layout pays it back with env(safe-area-inset-*) padding. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8f3ec" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <!-- iOS standalone / add-to-home-screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Heritage Villa Studio" />
    <meta name="format-detection" content="telephone=no" />

    <title>Heritage Villa Studio | استوديو الفلل التراثية</title>
    <meta
      name="description"
      content="Heritage Villa Studio — five Saudi heritage architectural styles reimagined as modern villas in interactive 3D."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Heritage Villa Studio" />
    <meta property="og:title" content="Heritage Villa Studio" />
    <meta
      property="og:description"
      content="Najdi, Salmani, Hijazi, Asiri and Eastern Coastal — five Saudi heritage styles as modern villas in interactive 3D. Turn each villa and read its signature motifs."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://osos3lom.github.io/dream3d/" />
    <meta
      property="og:image"
      content="https://osos3lom.github.io/dream3d/og-cover.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Five modern villas in Najdi, Salmani, Hijazi, Asiri and Eastern Coastal heritage styles, beside the words Heritage Villa Studio."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Heritage Villa Studio" />
    <meta
      name="twitter:description"
      content="Najdi, Salmani, Hijazi, Asiri and Eastern Coastal — five Saudi heritage styles as modern villas in interactive 3D. Turn each villa and read its signature motifs."
    />
    <meta
      name="twitter:image"
      content="https://osos3lom.github.io/dream3d/og-cover.jpg"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
